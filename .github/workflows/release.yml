# Builds the signed release APK (see docs/RELEASE.md).
# - Tag push v*: checks the tag matches versionName and creates a DRAFT release with the APK.
# - Manual run (Actions tab): same build, APK uploaded as a workflow artifact, no release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # SHA-256 of the Nonit0 release certificate (public, from apksigner --print-certs)
      EXPECTED_CERT_SHA256: a20dca38b82360b1c3bf22208dca437667e0d007db8f76f5a76e0e23bdf7faa6
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Read version
        id: version
        run: |
          name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "versionName=$name"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$name" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $name"
            exit 1
          fi

      # Without keystore.properties Gradle would fall back to the debug key: fail instead.
      - name: Write keystore.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for s in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!s}" ] || { echo "::error::Missing secret $s"; exit 1; }
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Verify signature
        id: apk
        run: |
          apk="app/build/outputs/apk/release/Spotui_v${{ steps.version.outputs.name }}.apk"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs "$apk" | tee certs.txt
          grep -q "certificate SHA-256 digest: $EXPECTED_CERT_SHA256" certs.txt \
            || { echo "::error::APK is not signed with the Nonit0 release key"; exit 1; }
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Upload artifact (manual run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          # Uploads the .apk itself (no zip); the artifact is named after the file
          archive: false
          path: ${{ steps.apk.outputs.path }}

      - name: Create draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}" \
            --draft --title "Spotui $GITHUB_REF_NAME" --generate-notes
